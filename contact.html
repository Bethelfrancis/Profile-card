<!DOCTYPE html>
<html lang="en">
  <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Contact | Bethel Francis</title>
        <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
        <nav class="nav">
            <h2 class="logo">BETHEL FRANCIS</h2>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="container contact-page">
        <h1>Contact Me</h1>
        <form id="contact-form">
            <label for="name">Full Name</label>
            <input type="text" id="name" data-testid="test-contact-name" required />
            <p                                                                                      
                id="error-name"
                data-testid="test-contact-error-name"
                aria-live="polite"
            ></p>

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                data-testid="test-contact-email"
                required
            />
            <p
                id="error-email"
                data-testid="test-contact-error-email"
                aria-live="polite"
            ></p>

            <label for="subject">Subject</label>
            <input
                type="text"
                id="subject"
                data-testid="test-contact-subject"
                required
            />
            <p
                id="error-subject"
                data-testid="test-contact-error-subject"
                aria-live="polite"
            ></p>

            <label for="message">Message</label>
            <textarea
                id="message"
                rows="5"
                data-testid="test-contact-message"
                minlength="10"
                required
            ></textarea>
            <p
                id="error-message"
                data-testid="test-contact-error-message"
                aria-live="polite"
            ></p>

            <button type="submit" data-testid="test-contact-submit">
                Send Message
            </button>

            <p id="success" data-testid="test-contact-success" hidden>
                ✅ Message sent successfully!
            </p>
      </form>
    </main>

    <footer>
      <p>&copy; 2025 Bethel Francis</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
