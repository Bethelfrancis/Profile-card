<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bethel Francis | Profile Card</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <nav class="nav">
        <h2 class="logo">BETHEL FRANCIS</h2>
        <ul class="nav-links">
          <li><a href="index.html" class="active">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main class="container">
      <section class="profile-card">
        <img
          src="bethel.jpg"
          alt="Profile photo of Bethel Francis"
          class="profile-img"
          data-testid="test-profile-img"
        />
        <h1 data-testid="test-profile-name">Bethel Francis</h1>
        <h3 data-testid="test-profile-role">Frontend Developer</h3>
        <p data-testid="test-profile-bio">
          Passionate about creating accessible and interactive user experiences.
          I build responsive, modern interfaces with clean and efficient code.
        </p>

        <div class="time-box">
          <p>Current Time (ms):</p>
          <p id="user-time" data-testid="test-current-time"></p>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2025 Bethel Francis | Frontend Wizards Task</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
